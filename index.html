<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lia's Private Live Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .glow-btn { animation: glow 2s infinite alternate; }
        @keyframes glow { 0% { box-shadow: 0 0 5px #10b981; } 100% { box-shadow: 0 0 20px #10b981, 0 0 30px #10b981; } }
        .toast-slide { animation: slideUpFade 4s forwards; }
        @keyframes slideUpFade { 0% { transform: translateY(100px); opacity: 0; } 10% { transform: translateY(0); opacity: 1; } 90% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
        .blur-trap { filter: blur(8px); transition: filter 0.3s; }
        .blur-trap-container:hover .blur-trap { filter: blur(4px); }
        .progress-loading { height: 3px; width: 0%; background: #3b82f6; transition: width 0.5s; }
    </style>
</head>
<body class="antialiased overflow-hidden">

    <!-- Top Loading Bar -->
    <div class="fixed top-0 left-0 w-full z-[100]">
        <div id="mainProgress" class="progress-loading"></div>
    </div>

    <!-- Age Gate Overlay -->
    <div id="ageGate" class="fixed inset-0 bg-black z-[200] flex flex-col items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-3xl max-w-md w-full text-center border-t-4 border-red-500 shadow-[0_0_50px_rgba(239,68,68,0.3)]">
            <i class="fas fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
            <h1 class="text-3xl font-black mb-2 uppercase">18+ Only</h1>
            <p class="text-gray-400 mb-6 text-sm">Create a FREE account to watch Lia's private broadcast.</p>
            <div class="flex gap-4">
                <button onclick="goCPA()" class="w-1/2 bg-gray-800 text-gray-400 py-3 rounded-xl font-bold hover:bg-gray-700 transition">Exit</button>
                <button onclick="acceptAge()" class="w-1/2 bg-red-600 text-white py-3 rounded-xl font-bold glow-btn transition">I am 18+</button>
            </div>
        </div>
    </div>

    <div id="contentWrapper" class="opacity-0 transition-opacity duration-1000 h-screen overflow-y-auto pb-32">
        <nav class="sticky top-0 z-[60] glass-panel border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
                <div class="flex items-center gap-3">
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100" class="w-10 h-10 rounded-full border-2 border-green-500">
                    <div>
                        <h1 class="font-black text-lg">Lia <i class="fas fa-check-circle text-blue-500 text-sm"></i></h1>
                        <p class="text-[10px] text-green-400 uppercase font-bold"><span id="liveViewers">1,842</span> Viewers</p>
                    </div>
                </div>
                <button onclick="triggerTrap('nav')" class="bg-green-600 px-4 py-1.5 rounded-lg text-xs font-bold shadow-lg">JOIN LIVE</button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Video Section -->
            <div class="lg:col-span-8">
                <div class="relative glass-panel rounded-2xl overflow-hidden shadow-2xl border border-gray-800 group" onclick="triggerTrap('video')">
                    <div class="absolute top-4 left-4 bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded z-10">LIVE</div>
                    <iframe src="https://drive.google.com/file/d/13SzbqnfE2kgRpaE2cdNV_EJG3I0UwP8G/preview" class="w-full aspect-video pointer-events-none opacity-80"></iframe>
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center cursor-pointer">
                        <i class="fas fa-play-circle text-6xl text-white/70 group-hover:scale-110 transition"></i>
                    </div>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="lg:col-span-4">
                <div class="glass-panel rounded-2xl p-4 h-[400px] flex flex-col">
                    <div id="chatBox" class="flex-1 overflow-y-auto space-y-3 text-xs pr-2">
                        <div class="flex gap-2"><strong class="text-blue-400">Mark99:</strong> <span>Hey Lia!</span></div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <input type="text" placeholder="Type..." class="w-full bg-gray-800 rounded-lg px-3 py-2 text-xs" disabled>
                        <button onclick="triggerTrap('chat')" class="bg-blue-600 px-4 rounded-lg"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Call Overlay -->
    <div id="callOverlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-[150] flex flex-col items-center justify-center hidden">
        <div class="text-center">
            <div class="relative w-32 h-32 mx-auto mb-6">
                <div class="absolute inset-0 rounded-full bg-green-500/20 animate-ping"></div>
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200" class="w-full h-full object-cover rounded-full border-4 border-gray-800 relative z-10">
            </div>
            <h1 class="text-4xl font-black mb-2">Lia</h1>
            <p class="text-green-400 mb-12">Incoming Video Call...</p>
            <div class="flex gap-8">
                <button onclick="closeCall()" class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center text-2xl"><i class="fas fa-phone-slash"></i></button>
                <button onclick="goCPA()" class="w-16 h-16 rounded-full bg-green-500 flex items-center justify-center text-2xl"><i class="fas fa-phone"></i></button>
            </div>
        </div>
    </div>

    <!-- Trap Modal -->
    <div id="trapModal" class="fixed inset-0 bg-black/90 z-[200] hidden flex items-center justify-center p-4">
        <div class="glass-panel p-10 rounded-3xl max-w-md w-full text-center border border-blue-500/50">
            <h2 class="text-2xl font-black mb-4">Action Required!</h2>
            <p class="text-gray-300 text-sm mb-6">You must create a free account to interact with Lia.</p>
            <button onclick="goCPA()" class="w-full bg-gradient-to-r from-green-500 to-blue-600 py-4 rounded-xl font-black uppercase tracking-widest hover:scale-105 transition">Start Private Chat</button>
        </div>
    </div>

    <audio id="ringAudio" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <div id="toastContainer" class="fixed bottom-4 left-4 z-[90] flex flex-col gap-2"></div>

    <script>
        const CPA_LINK = "https://t.taffizerq.com/click?pid=3844&offer_id=2310";
        let originalTitle = document.title;
        let ring = document.getElementById('ringAudio');

        // 1. Back Button Hijack
        history.pushState(null, "", location.href);
        window.onpopstate = () => { location.href = CPA_LINK; };

        // 2. Tab Hibernation Hook
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                document.title = "📞 (1) Lia is calling...";
                // Ghost Notification Triggered on Hidden
                if (Notification.permission === "granted") {
                    new Notification("📞 Lia is waiting!", {
                        body: "She wants to start a private session. Click to join!",
                        icon: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100"
                    }).onclick = () => { window.focus(); location.href = CPA_LINK; };
                }
            } else {
                document.title = originalTitle;
            }
        });

        // 3. Auto-Redirect Inactivity (2 mins)
        let idleTime = 0;
        setInterval(() => {
            idleTime++;
            if (idleTime >= 120) location.href = CPA_LINK;
        }, 1000);
        document.onmousemove = () => { idleTime = 0; };

        // 4. Loading Bar Animation
        function startLoading() {
            let width = 0;
            const bar = document.getElementById('mainProgress');
            setInterval(() => {
                if (width < 95) {
                    width += Math.random() * 2;
                    bar.style.width = width + '%';
                }
            }, 1000);
        }

        function acceptAge() {
            document.getElementById('ageGate').classList.add('hidden');
            document.getElementById('contentWrapper').classList.replace('opacity-0', 'opacity-100');
            document.body.classList.remove('overflow-hidden');
            startLoading();
            setTimeout(requestNotify, 10000);
            setTimeout(triggerCall, 15000);
        }

        function requestNotify() {
            if ("Notification" in window) {
                Notification.requestPermission();
            }
        }

        function triggerCall() {
            document.getElementById('callOverlay').classList.remove('hidden');
            ring.play().catch(() => {});
        }

        function closeCall() {
            document.getElementById('callOverlay').classList.add('hidden');
            ring.pause();
            triggerTrap();
        }

        function triggerTrap() {
            document.getElementById('trapModal').classList.remove('hidden');
        }

        function goCPA() {
            location.href = CPA_LINK;
        }

        // Viewers & Toasts
        setInterval(() => {
            let viewers = document.getElementById('liveViewers');
            viewers.innerText = (parseInt(viewers.innerText.replace(',','')) + Math.floor(Math.random() * 10 - 5)).toLocaleString();
        }, 3000);

    </script>
</body>
</html>
